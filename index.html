<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Quest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="game">
      <!-- Title screen -->
      <section id="title-screen" class="screen title">
        <p class="title__tag">A Number Adventure</p>
        <h1 class="title__name">Math<br />Quest</h1>
        <div class="title__sprites">
          <img src="./img/bw_girl_v3.gif" alt="Hero" class="sprite sprite--hero" />
          <span class="title__vs">VS</span>
          <img src="./img/Sprite-0001b.gif" alt="Monster" class="sprite sprite--foe" />
        </div>
        <button id="start-btn" class="btn btn--big" type="button">Start Quest</button>
        <p class="hint">or press <kbd>Enter</kbd></p>
      </section>

      <!-- Game screen -->
      <section id="game-screen" class="screen play" hidden>
        <header class="hud">
          <div class="hud__item life"></div>
          <div class="hud__item level"></div>
          <div class="hud__item score"></div>
          <div class="hud__item high-score"></div>
        </header>

        <div class="arena">
          <img src="./img/bw_girl_v3.gif" alt="Player" class="sprite player" />
          <img src="./img/Sprite-0001b.gif" alt="Monster" class="sprite monster" />
        </div>

        <div class="panel">
          <p class="problem"></p>
          <div class="answer-row">
            <input
              type="number"
              class="your-answer"
              placeholder="Your answer"
              autocomplete="off"
            />
            <button id="attack-btn" class="btn" type="button">Attack!</button>
          </div>
          <div class="ops" role="group" aria-label="Operation">
            <button type="button" class="op" data-op="+">+</button>
            <button type="button" class="op" data-op="-">&minus;</button>
            <button type="button" class="op" data-op="×">&times;</button>
            <button type="button" class="op" data-op="÷">&divide;</button>
          </div>
        </div>
      </section>

      <!-- Game over overlay -->
      <div id="gameover" class="overlay" hidden>
        <div class="overlay__card">
          <h2>Game Over</h2>
          <p class="overlay__score"></p>
          <p class="overlay__best"></p>
          <button id="retry-btn" class="btn btn--big" type="button">Play Again</button>
          <p class="hint">or press <kbd>Enter</kbd></p>
        </div>
      </div>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
